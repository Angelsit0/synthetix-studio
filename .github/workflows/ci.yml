name: verificar

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # El README promete Python 3.10 o superior: se prueba el mínimo y versiones recientes.
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Falla si algo rompe el proyecto (importaciones, consola que se cae, estructuras
      # prohibidas, pruebas unitarias) o si queda algo sin implementar.
      - name: Verificación completa
        run: python scripts/verificar.py --estricto
